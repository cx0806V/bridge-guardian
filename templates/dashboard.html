<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>桥梁健康监测大屏</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a1930; color: #cfe8ff; font-family: "Microsoft YaHei", sans-serif; padding: 10px; min-height: 100vh; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e3a5f; padding-bottom: 8px; margin-bottom: 10px; }
    header h1 { font-size: 22px; color: #4fc3f7; }
    header a { color: #4fc3f7; text-decoration: none; margin-left: 8px; }
    header a:hover { text-decoration: underline; }
    header a.danger { color: #ff6b6b; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .panel { background: #10263f; border: 1px solid #1e3a5f; border-radius: 8px; padding: 12px; min-height: 220px; }
    .panel h3 { font-size: 15px; color: #7fd4ff; margin-bottom: 8px; }
    .big-num { font-size: 42px; font-weight: bold; text-align: center; }
    .big-num.normal { color: #4ade80; }
    .big-num.danger { color: #ff4444; }
    .status { text-align: center; margin-top: 6px; }
    .status.ok { color: #4ade80; }
    .status.bad { color: #ff4444; }
    .meta { text-align: center; color: #7a9cc0; font-size: 12px; margin-top: 8px; }
    #chart, #gauge { width: 100%; height: 220px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 4px 6px; border-bottom: 1px solid #1e3a5f; text-align: center; }
    th { color: #7fd4ff; }
    td.alarm { color: #ff6b6b; }
    .clear-btn { float: right; background: #ff4444; color: #fff; border: none; border-radius: 6px; padding: 3px 12px; cursor: pointer; font-size: 12px; }
    .clear-btn:hover { background: #cc0000; }
    .mini-btn { display: block; margin: 8px auto 0; background: #1e88e5; color: #fff; border: none; border-radius: 6px; padding: 4px 14px; cursor: pointer; font-size: 12px; }
    .mini-btn:hover { background: #1565c0; }
    .ack-btn { border: 0; border-radius: 4px; padding: 3px 8px; background: #1e88e5; color: #fff; cursor: pointer; }
    .connection-status { text-align: center; color: #4ade80; font-size: 12px; margin-top: 6px; }
    .connection-status.error { color: #ff6b6b; }
    @media (max-width: 760px) {
      body { padding: 8px; }
      header { align-items: flex-start; gap: 8px; flex-direction: column; }
      .grid { grid-template-columns: 1fr; }
      .panel { min-height: 0; }
      .big-num { font-size: 34px; }
      .panel[style] { grid-column: auto !important; overflow-x: auto; }
    }
  </style>
</head>
<body>

<header>
  <h1>🌉 桥梁结构健康监测系统</h1>
  <div>欢迎, {{ user }}
    | <a href="/history">📜 历史记录</a>
    | <a href="/settings">⚙ 设置</a>
    | <a class="danger" href="/logout">退出</a >
  </div>
</header>

<div class="grid">

  <div class="panel">
    <h3>当前应变值</h3>
    <div id="strainNum" class="big-num normal">--</div>
    <div id="statusBar" class="status ok">● 状态正常</div>
    <p class="meta">采集周期：<span id="intervalShow">--</span> 秒/次 ｜ 报警阈值：<span id="thresholdShow">{{ threshold }}</span> με</p>
    <p class="meta">最后采样：<span id="lastSampleTime">--</span> ｜ 累计采样：<span id="sampleCount">0</span> 次</p>
    <p id="connectionStatus" class="connection-status">● 数据连接正常</p>
    <p class="meta">数据源状态：<span id="sensorStatus">--</span></p>
    <button class="mini-btn" onclick="clearData()">🧹 一键清除数据</button>
  </div>

  <div class="panel">
    <h3>阈值仪表（<span id="gaugeThreshold">{{ threshold }}</span> με）</h3>
    <div id="gauge"></div>
  </div>

  <div class="panel">
    <h3>报警统计</h3>
    <div class="big-num" id="alarmCount" style="color:#ffb74d">0</div>
    <p class="status ok">累计报警次数</p >
    <p class="meta">历史明细见右上角「📜 历史记录」</p >
  </div>

  <div class="panel">
    <h3>实时应变曲线</h3>
    <div id="chart"></div>
  </div>

  <div class="panel" style="grid-column: 1 / -1;">
    <h3>报警记录
      <button class="clear-btn" onclick="clearAlarms()">🗑 清除报警</button>
    </h3>
    <table>
      <thead><tr><th>时间</th><th>应变值 (με)</th><th>等级</th><th>处理状态</th><th>操作</th></tr></thead>
      <tbody id="alarmTable"></tbody>
    </table>
  </div>

</div>

<script>
  const gaugeChart = echarts.init(document.getElementById('gauge')); // 应变仪表盘实例
  const lineChart = echarts.init(document.getElementById('chart')); // 实时曲线实例

  gaugeChart.setOption({
    series: [{
      type: 'gauge', min: 0, max: 200,
      axisLine: { lineStyle: { width: 12, color: [[0.6, '#4ade80'], [1, '#ff4444']] } },
      pointer: { itemStyle: { color: '#ffb74d' } },
      detail: { formatter: '{value} με', color: '#cfe8ff', fontSize: 16 },
      data: [{ value: 0 }]
    }]
  });

  lineChart.setOption({
    xAxis: { type: 'category', data: [], axisLabel: { color: '#7fd4ff' } },
    yAxis: { type: 'value', axisLabel: { color: '#7fd4ff' } },
    tooltip: { trigger: 'axis' },
    series: [{
      name: '应变值', type: 'line', data: [], smooth: true, showSymbol: false,
      lineStyle: { color: '#4fc3f7', width: 2 },
      markLine: {
        data: [{ yAxis: {{ threshold }}, name: '阈值' }],
        lineStyle: { color: '#ff4444', type: 'dashed' },
        label: { color: '#ff6b6b', formatter: '阈值 {{ threshold }}μ' }
      }
    }]
  });

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function setConnectionStatus(isConnected, message) {
    const statusElement = document.getElementById('connectionStatus'); // 数据连接状态显示元素
    statusElement.className = isConnected ? 'connection-status' : 'connection-status error';
    statusElement.textContent = message;
  }

  async function refresh() {
    try {
      const response = await fetch('/api/data'); // 获取实时监测数据的响应
      if (response.status === 401) { window.location.href = '/login'; return; }
      if (!response.ok) throw new Error(`请求失败：${response.status}`);
      const dashboardData = await response.json(); // 后端返回的大屏数据

      const strainElement = document.getElementById('strainNum'); // 当前应变值显示元素
      const alarmStatusElement = document.getElementById('statusBar'); // 报警状态显示元素
      strainElement.textContent = dashboardData.strain.toFixed(2) + ' με';
      if (dashboardData.strain > dashboardData.threshold) {
        strainElement.className = 'big-num danger';
        alarmStatusElement.className = 'status bad';
        alarmStatusElement.textContent = '⚠ 超限报警';
      } else {
        strainElement.className = 'big-num normal';
        alarmStatusElement.className = 'status ok';
        alarmStatusElement.textContent = '● 状态正常';
      }

      document.getElementById('intervalShow').textContent = dashboardData.interval;
      document.getElementById('thresholdShow').textContent = dashboardData.threshold;
      document.getElementById('gaugeThreshold').textContent = dashboardData.threshold;
      document.getElementById('lastSampleTime').textContent = dashboardData.last_sample_time;
      document.getElementById('sampleCount').textContent = dashboardData.sample_count;
      document.getElementById('sensorStatus').textContent = dashboardData.sensor_status;
      gaugeChart.setOption({ series: [{ data: [{ value: dashboardData.strain }] }] });
      document.getElementById('alarmCount').textContent = dashboardData.alarms.length;

      lineChart.setOption({
        xAxis: { data: dashboardData.history.map(historyItem => historyItem.time) },
        series: [{
          data: dashboardData.history.map(historyItem => historyItem.strain),
          markLine: {
            data: [{ yAxis: dashboardData.threshold, name: '阈值' }],
            label: { formatter: `阈值 ${dashboardData.threshold}μ` }
          }
        }]
      });

      document.getElementById('alarmTable').innerHTML = dashboardData.alarms.map(alarmItem =>
        `<tr><td>${escapeHtml(alarmItem.time)}</td><td class="alarm">${escapeHtml(alarmItem.strain)}</td><td class="alarm">${escapeHtml(alarmItem.type)}</td><td>${escapeHtml(alarmItem.status)}</td><td>${alarmItem.status === '未处理' ? `<button class="ack-btn" onclick="acknowledgeAlarm(${alarmItem.id})">确认处理</button>` : '已完成'}</td></tr>`
      ).join('');
      setConnectionStatus(true, '● 数据连接正常');
    } catch (error) {
      console.error('获取数据失败', error);
      setConnectionStatus(false, '⚠ 数据连接失败，请检查服务是否运行');
    }
  }

  async function clearAlarms() {
    if (!confirm('确定清除当前报警和 CSV 历史报警吗？')) return;
    try {
      const response = await fetch('/api/clear_alarms', { method: 'POST' }); // 清除报警请求的响应
      if (response.status === 401) { window.location.href = '/login'; return; }
      if (!response.ok) throw new Error(`请求失败：${response.status}`);
      refresh();
    } catch (error) {
      console.error('清除报警失败', error);
      setConnectionStatus(false, '⚠ 清除报警失败');
    }
  }

  async function acknowledgeAlarm(alarmId) {
    try {
      const response = await fetch(`/api/acknowledge_alarm/${alarmId}`, { method: 'POST' }); // 确认处理报警的响应
      if (response.status === 401) { window.location.href = '/login'; return; }
      if (!response.ok) throw new Error(`请求失败：${response.status}`);
      refresh();
    } catch (error) {
      console.error('确认报警失败', error);
      setConnectionStatus(false, '⚠ 确认报警失败');
    }
  }

  async function clearData() {
    if (!confirm('确定清除当前数据和 CSV 历史数据吗？')) return;
    try {
      const response = await fetch('/api/clear_data', { method: 'POST' }); // 清除数据请求的响应
      if (response.status === 401) { window.location.href = '/login'; return; }
      if (!response.ok) throw new Error(`请求失败：${response.status}`);
      refresh();
    } catch (error) {
      console.error('清除数据失败', error);
      setConnectionStatus(false, '⚠ 清除数据失败');
    }
  }

  refresh();
  setInterval(refresh, 1000);
  window.addEventListener('resize', () => { gaugeChart.resize(); lineChart.resize(); });
</script>

</body>
</html>
