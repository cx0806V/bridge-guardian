<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统设置 - 桥体卫士</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body { padding: 20px; position: relative; }
    .bridge-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: url('/static/bridge.svg') no-repeat center bottom / 100% auto; opacity: .08; }
    .page { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 20px; }
    header h1 { font-size: 22px; color: var(--accent); letter-spacing: 1px; }
    .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
    .card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); padding: 22px; }
    .card h3 { font-size: 15px; color: #8fd8ff; margin-bottom: 4px; font-weight: 600; }
    .card .hint { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    label { display: block; margin-top: 16px; color: #8fd8ff; font-size: 14px; }
    .explain { color: var(--muted); font-size: 12.5px; line-height: 1.6; margin-top: 4px; }
    input { width: 100%; margin-top: 6px; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--bg); color: var(--text); font-size: 15px; outline: none; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    button { margin-top: 22px; width: 100%; padding: 11px; border: 0; border-radius: 8px;
      background: linear-gradient(90deg,#1e88e5,#2b9edb); color: #fff; cursor: pointer;
      font-size: 15px; font-weight: 700; letter-spacing: 2px; }
    button:hover { filter: brightness(1.12); }
    .risk-tip { margin-top: 16px; padding: 11px 13px; border-radius: 8px; font-size: 13px; line-height: 1.7;
      background: var(--warn-bg); border: 1px solid var(--warn-border); color: #fcd34d; }
    #message { min-height: 20px; margin-top: 12px; text-align: center; color: var(--ok); }
    #message.error { color: var(--crit); }
    /* 审计列表 */
    .audit-list { max-height: 400px; overflow-y: auto; }
    .audit-item { padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
    .audit-item:last-child { border-bottom: none; }
    .audit-item .t { color: var(--muted); font-size: 12px; }
    .audit-item .a { color: var(--accent); }
    .audit-item .d { color: var(--text); }
    .audit-empty { color: var(--muted); text-align: center; padding: 24px 0; font-size: 13px; }
  </style>
</head>
<body>

<div class="bridge-bg"></div>
<div class="page">

<header>
  <h1>⚙ 系统设置</h1>
  <a class="nav-link" href="/dashboard">← 返回主画面</a>
</header>

<div class="wrap">

  <!-- 参数设置 -->
  <div class="card">
    <h3>监测参数</h3>
    <p class="hint">报警阈值与采集周期，保存后立即生效并写入审计</p>
    <form id="settingsForm">
      <label for="threshold">报警阈值（{{ unit }}）</label>
      <p class="explain">当应变指标超过该阈值时触发分级报警（预警/报警/严重报警）。数值为相对应变指标（无量纲），非工程微应变，范围 1–200。</p>
      <input id="threshold" type="number" min="1" max="200" step="0.1" required>

      <label for="interval">采集周期（秒）</label>
      <p class="explain">两次采样的时间间隔，决定数据刷新频率与规则引擎的评估节奏。范围 0.1–60 秒。</p>
      <input id="interval" type="number" min="0.1" max="60" step="0.1" required>

      <div class="risk-tip">⚠ 风险提示：阈值过低会导致频繁报警，过高则可能漏报；修改后<b>立即生效</b>并写入变更审计，供答辩追溯。</div>
      <button type="submit">保存设置</button>
    </form>
    <p id="message"></p>
  </div>

  <!-- 变更审计 -->
  <div class="card">
    <h3>最近变更记录</h3>
    <p class="hint">谁在何时改了什么参数，全程留痕</p>
    <div class="audit-list" id="auditList">
      <div class="audit-empty">加载中…</div>
    </div>
  </div>

</div>
</div>

<!-- 移动端底部导航（窄屏显示） -->
<nav class="mobile-nav">
  <a href="/dashboard"><span class="m-ico">🏠</span><span>首页</span></a>
  <a href="/history"><span class="m-ico">📜</span><span>历史</span></a>
  <a href="/settings" class="active"><span class="m-ico">⚙</span><span>设置</span></a>
  <a href="/logout" class="danger"><span class="m-ico">⏻</span><span>退出</span></a>
</nav>

<script>
  const CSRF_TOKEN = {{ csrf_token|tojson }};
  const messageElement = document.getElementById('message');

  function showMessage(message, isError = false) {
    messageElement.textContent = message;
    messageElement.className = isError ? 'error' : '';
  }

  const ACTION_MAP = {
    update_settings: '参数修改',
    clear_data: '清除数据',
    clear_alarms: '清除报警',
    acknowledge_alarm: '报警处置',
    set_scenario: '场景切换',
  };

  function escapeHtml(v){ return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function loadSettings() {
    try {
      const response = await fetch('/api/settings');
      if (response.status === 401) { window.location.href = '/login'; return; }
      if (!response.ok) throw new Error(`请求失败：${response.status}`);
      const s = await response.json();
      document.getElementById('threshold').value = s.threshold;
      document.getElementById('interval').value = s.interval;
    } catch (e) { console.error(e); showMessage('读取设置失败。', true); }
  }

  async function loadAudit() {
    try {
      const response = await fetch('/api/audit');
      if (response.status === 401) { window.location.href = '/login'; return; }
      if (!response.ok) throw new Error(`请求失败：${response.status}`);
      const rows = await response.json();
      const html = rows.map(r =>
        `<div class="audit-item">
          <div class="t">${escapeHtml(r.ts)} · ${escapeHtml(r.actor)}</div>
          <div><span class="a">${ACTION_MAP[r.action] || escapeHtml(r.action)}</span> <span class="d">${escapeHtml(r.detail || '')}</span></div>
        </div>`).join('');
      document.getElementById('auditList').innerHTML = html || '<div class="audit-empty">暂无变更记录</div>';
    } catch (e) { console.error(e); document.getElementById('auditList').innerHTML = '<div class="audit-empty">审计记录加载失败</div>'; }
  }

  document.getElementById('settingsForm').addEventListener('submit', async event => {
    event.preventDefault();
    const thresholdValue = Number(document.getElementById('threshold').value);
    const intervalValue = Number(document.getElementById('interval').value);
    try {
      const response = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF_TOKEN },
        body: JSON.stringify({ threshold: thresholdValue, interval: intervalValue })
      });
      if (response.status === 401) { window.location.href = '/login'; return; }
      const result = await response.json();
      if (!response.ok) throw new Error(result.error);
      showMessage('设置已保存并立即生效。');
      loadAudit(); // 刷新审计记录
    } catch (e) { showMessage(e.message || '保存设置失败。', true); }
  });

  loadSettings();
  loadAudit();
</script>

</body>
</html>
