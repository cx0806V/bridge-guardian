<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>登录 - 桥梁结构健康监测系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a1930; font-family: "Microsoft YaHei", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #10263f; border: 1px solid #1e3a5f; border-radius: 10px; padding: 40px; width: 340px; }
    h1 { color: #4fc3f7; font-size: 20px; text-align: center; margin-bottom: 24px; }
    label { color: #7fd4ff; font-size: 14px; display: block; margin: 12px 0 4px; }
    input { width: 100%; padding: 10px; border: 1px solid #1e3a5f; border-radius: 6px; background: #0a1930; color: #cfe8ff; font-size: 14px; }
    button { width: 100%; margin-top: 20px; padding: 10px; background: #1e88e5; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
    button:hover { background: #1565c0; }
    .error { color: #ff6b6b; font-size: 13px; text-align: center; margin-top: 12px; }
  </style>
</head>
<body>

<div class="card">
  <h1>🌉 桥梁结构健康监测系统</h1>
  <form method="POST">
    <label>用户名</label>
    <input type="text" name="username" required>
    <label>密码</label>
    <input type="password" name="password" required>
    <button type="submit">登 录</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
</div>

</body>
</html>
