<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>登录 · 桥体卫士 — 桥梁结构健康监测</title>
  <meta name="theme-color" content="#ffffff">
  <!-- 内联 SVG 图标（data URI，绿色版）：避免浏览器自动探测 /favicon.ico 产生 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffffff'/%3E%3Cpath d='M5 23h22M5 23c3-6 7.5-9 11-9s8 3 11 9M16 14V7M9 7h14' fill='none' stroke='%2316a34a' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    /* 登录页：与全站统一白色简洁主题（不再是深色卡片） */
    body.login-body {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, #f8fafb 0%, #f1f4f6 100%);
    }
    .login-wrap { width: 100%; max-width: 400px; }
    .card.login-card {
      background: #fff; border: 1px solid var(--border, #e5e8eb); border-radius: 14px;
      padding: 34px 32px 28px; box-shadow: 0 12px 32px rgba(16, 24, 40, .07);
    }
    .brand-head { text-align: center; margin-bottom: 4px; }
    .brand-head .mark {
      width: 54px; height: 54px; margin: 0 auto 14px; display: grid; place-items: center;
      border-radius: 14px; color: #fff; background: var(--accent, #16a34a);
      box-shadow: 0 4px 14px rgba(22, 163, 74, .28);
    }
    .brand-head .mark svg { width: 30px; height: 30px; }
    .login-card h1 { color: var(--text-strong, #111827); font-size: 23px; text-align: center;
      letter-spacing: .12em; font-weight: 700; }
    .login-card .sub { color: var(--muted, #6b7280); font-size: 13px; text-align: center;
      margin: 10px 0 22px; line-height: 1.8; }
    .login-card .sub .pill { display: inline-block; margin-top: 8px; padding: 3px 12px; border-radius: 12px;
      font-size: 11px; color: var(--accent, #16a34a);
      background: var(--accent-soft, rgba(22, 163, 74, .08));
      border: 1px solid var(--accent-border, rgba(22, 163, 74, .28)); }
    .login-card label { display: block; margin: 14px 0 6px; font-size: 13px; font-weight: 600;
      color: var(--text-strong, #111827); letter-spacing: .02em; }
    .field { position: relative; }
    .field .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 17px; height: 17px; color: var(--faint, #9ca3af); pointer-events: none; }
    .login-card input {
      width: 100%; min-height: 46px; padding: 12px 12px 12px 40px; font: inherit; font-size: 14px;
      border: 1px solid var(--border, #e5e8eb); border-radius: 8px;
      background: var(--bg, #f6f8f9); color: var(--text, #1f2937); outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s; }
    .login-card input:focus { border-color: var(--accent, #16a34a); background: #fff;
      box-shadow: 0 0 0 3px var(--accent-glow, rgba(22, 163, 74, .18)); }
    .login-card button {
      width: 100%; min-height: 48px; margin-top: 22px; padding: 12px; cursor: pointer;
      font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .22em;
      color: #fff; background: var(--accent, #16a34a); border: none; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(22, 163, 74, .24); transition: filter .15s, transform .05s; }
    .login-card button:hover { filter: brightness(1.05); }
    .login-card button:active { transform: translateY(1px); }
    .error { margin-top: 14px; padding: 9px; text-align: center; font-size: 13px; border-radius: 8px;
      color: var(--crit, #be123c); background: var(--crit-bg, rgba(190, 18, 60, .08));
      border: 1px solid var(--crit-border, rgba(190, 18, 60, .28)); }
    .foot { text-align: center; color: var(--faint, #9ca3af); font-size: 11px;
      margin-top: 16px; letter-spacing: .08em; line-height: 1.8; }
    @media (max-width: 420px) {
      .card.login-card { padding: 26px 20px 22px; }
      .login-card h1 { font-size: 20px; }
    }
  </style>
</head>
<body class="login-body">

<div class="login-wrap">
  <div class="card login-card">
    <div class="brand-head">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 17h18" />
          <path d="M3 17c2.4-4.4 6-6.6 9-6.6s6.6 2.2 9 6.6" />
          <path d="M12 10.4V5" />
          <path d="M6.5 5h11" />
        </svg>
      </div>
      <h1>桥体卫士</h1>
    </div>
    <p class="sub">桥梁结构健康监测系统<br>
      缩尺模型受载变化模拟 · 应变实时监测与分级报警
      <span class="pill">离线部署 · 可解释预警</span>
    </p>

    <!-- 说明：登录接口豁免 CSRF（登录前无可信 token），保持原有表单字段与 POST 目标不变 -->
    <form method="POST" action="/login">
      <label for="username">用户名</label>
      <div class="field">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="请输入用户名">
      </div>
      <label for="password">密码</label>
      <div class="field">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="请输入密码">
      </div>
      <button type="submit">登 录</button>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </form>

    <div class="foot">BRIDGE GUARDIAN · STRUCTURAL HEALTH MONITORING<br>
      数据口径：相对应变指标（无量纲，非工程微应变）</div>
  </div>
</div>

</body>
</html>
