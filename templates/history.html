<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>历史记录 - 桥梁结构健康监测系统</title>
  <script src="/static/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a1930; color: #cfe8ff; font-family: "Microsoft YaHei", sans-serif; padding: 10px; min-height: 100vh; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e3a5f; padding-bottom: 8px; margin-bottom: 10px; }
    header h1 { font-size: 22px; color: #4fc3f7; }
    header a { color: #4fc3f7; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    .tabs { margin-bottom: 10px; }
    .tabs button { background: #10263f; color: #7fd4ff; border: 1px solid #1e3a5f; border-radius: 6px; padding: 6px 18px; cursor: pointer; font-size: 14px; margin-right: 8px; }
    .tabs button.active { background: #1e88e5; color: #fff; }
    .panel { background: #10263f; border: 1px solid #1e3a5f; border-radius: 8px; padding: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 5px 6px; border-bottom: 1px solid #1e3a5f; text-align: center; }
    th { color: #7fd4ff; }
    td.alarm { color: #ff6b6b; }
    .stats { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .stat { flex: 1; min-width: 130px; background: #0a1930; border: 1px solid #1e3a5f; border-radius: 8px; padding: 10px; text-align: center; }
    .stat span { font-size: 24px; font-weight: bold; color: #ffb74d; display: block; }
    .stat label { font-size: 12px; color: #7a9cc0; }
    .message { color: #ff6b6b; text-align: center; margin: 10px 0; min-height: 18px; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
    .filters input, .filters button { padding: 6px 10px; border: 1px solid #1e3a5f; border-radius: 6px; background: #10263f; color: #cfe8ff; }
    .filters button { cursor: pointer; background: #1e88e5; border: 0; }
    .timeline { position: relative; padding: 4px 0; }
    .tl-item { display: flex; gap: 12px; padding: 10px 0; position: relative; }
    .tl-item::before { content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: #1e3a5f; }
    .tl-dot { width: 16px; height: 16px; border-radius: 50%; flex: 0 0 auto; margin-top: 2px; position: relative; z-index: 1; }
    .tl-dot.lv-warn { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
    .tl-dot.lv-alarm { background: #fb923c; box-shadow: 0 0 8px #fb923c; }
    .tl-dot.lv-crit { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
    .tl-body { flex: 1; background: rgba(10,25,48,.5); border: 1px solid #1e3a5f; border-radius: 8px; padding: 10px 12px; }
    .tl-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .tl-level { font-weight: 700; font-size: 13px; }
    .tl-rule { color: #4fc3f7; font-size: 12px; background: #123052; padding: 2px 8px; border-radius: 12px; }
    .tl-time { color: #7a9cc0; font-size: 12px; margin-left: auto; }
    .tl-src { color: #7a9cc0; font-size: 12px; }
    .tl-reason { color: #cfe8ff; font-size: 13px; margin-top: 6px; }
    .tl-status { color: #7a9cc0; font-size: 12px; margin-top: 6px; }
    .tl-status.done { color: #4ade80; }
    .tl-empty { text-align: center; color: #7a9cc0; padding: 24px 0; }
    @media (max-width: 760px) {
      body { padding: 8px; }
      header { align-items: flex-start; gap: 8px; flex-direction: column; }
      .tabs button { margin-bottom: 6px; }
      .stat { min-width: 100%; }
      .panel { overflow-x: auto; }
    }
  </style>
</head>
<body>

<header>
  <h1>📜 历史记录</h1>
  <a href="/dashboard">← 返回主画面</a>
</header>

<div class="tabs">
  <button id="tabAlarm" class="active" onclick="switchTab('alarm')">历史报警</button>
  <button id="tabData" onclick="switchTab('data')">历史数据比对</button>
</div>

<div class="filters">
  <label>开始时间 <input id="startTime" type="datetime-local"></label>
  <label>结束时间 <input id="endTime" type="datetime-local"></label>
  <button onclick="applyFilter()">查询</button>
  <button onclick="exportHistory()">导出当前结果</button>
</div>

<p id="historyMessage" class="message"></p>

<div id="alarmSection" class="panel">
  <div id="histAlarmTable" class="timeline"></div>
</div>

<div id="dataSection" style="display:none">
  <div class="stats">
    <div class="stat"><span id="avgAll">--</span><label>平均应变指标</label></div>
    <div class="stat"><span id="maxAll">--</span><label>最大值</label></div>
    <div class="stat"><span id="minAll">--</span><label>最小值</label></div>
    <div class="stat"><span id="overCount">--</span><label>超限次数 (<span id="overCountLabel">>{{ threshold }}</span>)</label></div>
    <div class="stat"><span id="compare">--</span><label>后半段 vs 前半段均值</label></div>
  </div>
  <div class="panel"><div id="histChart" style="width:100%;height:320px"></div></div>
</div>

<script>
  let currentThreshold = {{ threshold }}; // 当前生效报警阈值（动态同步，与设置页/大屏一致）
  let currentTab = 'alarm'; // 当前打开的历史记录标签页

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function showHistoryMessage(message) {
    document.getElementById('historyMessage').textContent = message; // 历史页面错误提示
  }

  function switchTab(tabName) {
    currentTab = tabName;
    const isAlarmTab = tabName === 'alarm'; // 当前是否显示报警标签页
    document.getElementById('alarmSection').style.display = isAlarmTab ? 'block' : 'none';
    document.getElementById('dataSection').style.display = isAlarmTab ? 'none' : 'block';
    document.getElementById('tabAlarm').className = isAlarmTab ? 'active' : '';
    document.getElementById('tabData').className = isAlarmTab ? '' : 'active';
    showHistoryMessage('');
    if (isAlarmTab) loadAlarms(); else loadData();
  }

  function getQueryString() {
    const startTime = document.getElementById('startTime').value.replace('T', ' '); // 筛选开始时间
    const endTime = document.getElementById('endTime').value.replace('T', ' '); // 筛选结束时间
    return new URLSearchParams({ start: startTime, end: endTime }).toString();
  }

  function applyFilter() {
    if (currentTab === 'alarm') loadAlarms(); else loadData();
  }

  function exportHistory() {
    const recordType = currentTab === 'alarm' ? 'alarms' : 'data'; // 当前导出的历史记录类型
    window.location.href = `/api/export/${recordType}?${getQueryString()}`;
  }

  async function loadAlarms() {
    try {
      const response = await fetch(`/api/history_alarms?${getQueryString()}`); // 获取筛选后历史报警的响应
      if (response.status === 401) { window.location.href = '/login'; return; }
      if (!response.ok) throw new Error(`请求失败：${response.status}`);
      const alarmRows = await response.json(); // SQLite 中的历史报警记录
      const lvCls = l => l === '严重报警' ? 'lv-crit' : (l === '报警' ? 'lv-alarm' : 'lv-warn');
      const html = alarmRows.slice().reverse().map(a =>
        `<div class="tl-item">
          <div class="tl-dot ${lvCls(a.level)}"></div>
          <div class="tl-body">
            <div class="tl-top">
              <span class="tl-level ${lvCls(a.level)}">${escapeHtml(a.level)}</span>
              <span class="tl-rule">${escapeHtml(a.rule)}</span>
              <span class="tl-time">${escapeHtml(a.ts)}</span>
              <span class="tl-src">${a.source === 'serial' ? '真实设备' : (a.source === 'sim' ? '模拟' : '历史导入')}</span>
            </div>
            <div class="tl-reason">${escapeHtml(a.reason)}</div>
            <div class="tl-status ${a.status === '已处理' ? 'done' : ''}">${a.status === '已处理' ? '✓ 已处理' : '● 未处理'}</div>
          </div>
        </div>`).join('');
      document.getElementById('histAlarmTable').innerHTML =
        html || '<div class="tl-empty">暂无历史报警</div>';
    } catch (error) {
      console.error('读取历史报警失败', error);
      showHistoryMessage('历史报警读取失败，请检查数据库和服务状态。');
    }
  }

  let historyChart = null; // 历史曲线图表实例
  async function loadData() {
    try {
      const response = await fetch(`/api/history_data?${getQueryString()}`); // 获取筛选后历史数据的响应
      if (response.status === 401) { window.location.href = '/login'; return; }
      if (!response.ok) throw new Error(`请求失败：${response.status}`);
      const dataRows = await response.json(); // SQLite 中的历史数据行
      if (dataRows.length === 0) {
        showHistoryMessage('暂无历史数据。');
        return;
      }

      const sampleTimes = dataRows.map(dataRow => dataRow.ts); // 历史采样时间列表
      const strainValues = dataRows.map(dataRow => parseFloat(dataRow.value)); // 历史应变数值列表
      const averageValue = strainValues.reduce((total, value) => total + value, 0) / strainValues.length;
      const maximumValue = Math.max(...strainValues); // 历史最大应变值
      const minimumValue = Math.min(...strainValues); // 历史最小应变值
      const overThresholdCount = strainValues.filter(value => value > currentThreshold).length;

      document.getElementById('avgAll').textContent = averageValue.toFixed(2);
      document.getElementById('maxAll').textContent = maximumValue.toFixed(2);
      document.getElementById('minAll').textContent = minimumValue.toFixed(2);
      document.getElementById('overCount').textContent = overThresholdCount;

      if (strainValues.length >= 2) {
        const midpoint = Math.floor(strainValues.length / 2); // 前后两段的分界位置
        const frontAverage = strainValues.slice(0, midpoint).reduce((total, value) => total + value, 0) / midpoint;
        const backAverage = strainValues.slice(midpoint).reduce((total, value) => total + value, 0) / (strainValues.length - midpoint);
        const averageDifference = backAverage - frontAverage;
        document.getElementById('compare').textContent =
          (averageDifference > 0.5 ? '↑ +' : averageDifference < -0.5 ? '↓ ' : '≈ ') + averageDifference.toFixed(2);
      }

      if (!historyChart) historyChart = echarts.init(document.getElementById('histChart'));
      historyChart.setOption({
        xAxis: { type: 'category', data: sampleTimes, axisLabel: { color: '#7fd4ff' } },
        yAxis: { type: 'value', axisLabel: { color: '#7fd4ff' } },
        tooltip: { trigger: 'axis' },
        dataZoom: [{ type: 'inside' }],
        series: [{
          name: '应变指标', type: 'line', data: strainValues, smooth: true, showSymbol: false,
          lineStyle: { color: '#4fc3f7', width: 2 },
          markLine: {
            data: [{ yAxis: currentThreshold, name: '阈值' }],
            lineStyle: { color: '#ff4444', type: 'dashed' },
            label: { color: '#ff6b6b', formatter: `阈值 ${currentThreshold}μ` }
          }
        }]
      });
    } catch (error) {
      console.error('读取历史数据失败', error);
      showHistoryMessage('历史数据读取失败，请检查数据库和服务状态。');
    }
  }

  async function loadThreshold() {
    try {
      const response = await fetch('/api/settings'); // 获取当前生效设置
      if (response.status === 401) { window.location.href = '/login'; return; }
      if (!response.ok) return;
      const s = await response.json();
      currentThreshold = s.threshold;
      const label = document.getElementById('overCountLabel');
      if (label) label.textContent = `>${currentThreshold}`;
      if (currentTab === 'data') loadData();
    } catch (e) { console.error('读取阈值失败', e); }
  }

  switchTab('alarm');
  loadThreshold();
  window.addEventListener('resize', () => { if (historyChart) historyChart.resize(); });
</script>

</body>
</html>
